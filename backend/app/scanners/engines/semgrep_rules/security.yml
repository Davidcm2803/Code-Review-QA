rules:
  - id: js-eval-usage
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Uso de eval() detectado. Permite ejecucion de codigo arbitrario si el
      input no esta 100% controlado (riesgo de RCE / inyeccion de codigo).
    patterns:
      - pattern: eval(...)

  - id: js-innerhtml-assignment
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      Asignacion directa a innerHTML. Si el contenido incluye datos de
      usuario sin sanitizar, es un vector de XSS.
    patterns:
      - pattern: $EL.innerHTML = $VAL

  - id: js-dangerously-set-inner-html
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      Uso de dangerouslySetInnerHTML en React. Verificar que el contenido
      este sanitizado (ej. con DOMPurify) antes de renderizar.
    patterns:
      - pattern: dangerouslySetInnerHTML={{ __html: $VAL }}

  - id: js-hardcoded-secret-assignment
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Posible secreto o credencial hardcodeada en el codigo fuente
      (password, apiKey, secret, token asignado a un literal string).
    patterns:
      - pattern-either:
          - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)(password|apikey|api_key|secret|token)\s*$

  - id: js-child-process-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Uso de child_process.exec/execSync con posible input dinamico.
      Puede permitir inyeccion de comandos del sistema operativo.
    patterns:
      - pattern-either:
          - pattern: require("child_process").exec(...)
          - pattern: require("child_process").execSync(...)
          - pattern: exec($CMD, ...)

  - id: js-sql-string-concat
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Posible construccion de query SQL por concatenacion de strings.
      Usar queries parametrizadas para evitar inyeccion SQL.
    patterns:
      - pattern-either:
          - pattern: $DB.query("..." + $VAR + "...")
          - pattern: $DB.query(`...${$VAR}...`)

  - id: js-insecure-random-for-security
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      Math.random() no es criptograficamente seguro. No usar para tokens,
      IDs de sesion, o cualquier valor con proposito de seguridad.
    patterns:
      - pattern: Math.random()

  - id: js-jwt-none-algorithm
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Verificar que la libreria JWT no acepte algorithm "none", lo cual
      permitiria falsificar tokens sin firma valida.
    patterns:
      - pattern: jwt.verify($TOKEN, $SECRET, { algorithms: [...] })
      - metavariable-regex:
          metavariable: $SECRET
          regex: .*

  - id: js-disabled-tls-verification
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Verificacion TLS/SSL deshabilitada (NODE_TLS_REJECT_UNAUTHORIZED=0
      o rejectUnauthorized: false). Expone a ataques man-in-the-middle.
    patterns:
      - pattern-either:
          - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
          - pattern: rejectUnauthorized = false

  - id: js-cors-wildcard-with-credentials
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      CORS configurado con origin "*" junto a credentials. Esta combinacion
      es invalida/insegura y puede exponer datos autenticados.
    patterns:
      - pattern: |
          cors({ origin: "*", credentials: true, ... })

  - id: js-localstorage-token-storage
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      Almacenar tokens de autenticacion en localStorage es vulnerable a
      robo via XSS (a diferencia de cookies httpOnly). Evaluar el riesgo
      segun el contexto de la aplicacion.
    patterns:
      - pattern-either:
          - pattern: localStorage.setItem("token", ...)
          - pattern: localStorage.setItem("$ANYTOKEN", ...)
      - metavariable-regex:
          metavariable: $ANYTOKEN
          regex: (?i).*(token|jwt|auth).*